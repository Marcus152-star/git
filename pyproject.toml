[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genfollower-inquiry-router"
version = "0.4.1"
description = "Shadow-mode inquiry classification, CRM export matching, and sales routing"
requires-python = ">=3.11"
dependencies = [
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
packaging = [
  "pyinstaller>=6,<7",
]

[project.scripts]
inquiry-router = "inquiry_router.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

